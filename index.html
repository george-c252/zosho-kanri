<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>蔵書管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <!-- スキャン画面 -->
    <section id="tab-scan" class="tab">
      <div class="screen-head">
        <h1>スキャン</h1>
      </div>
      <p id="status">カメラ起動中…</p>
      <video id="viewfinder" autoplay muted playsinline></video>
      <form id="manual-form">
        <input id="manual-isbn" inputmode="numeric" maxlength="13" placeholder="ISBN手入力（978から13桁）">
        <button type="submit">検索</button>
      </form>
      <section id="result" hidden>
        <div id="dup-banner" hidden></div>
        <div class="book-row">
          <img id="cover" alt="表紙" hidden>
          <div class="book-info">
            <p id="book-title"></p>
            <p id="book-author"></p>
            <p id="book-publisher"></p>
            <p id="book-isbn"></p>
          </div>
        </div>
        <!-- 書誌API全滅時の手入力（仕様§5.2: 登録は必ず完了できる） -->
        <div id="manual-book" hidden>
          <input id="manual-title" placeholder="タイトル（必須）">
          <input id="manual-author" placeholder="著者">
        </div>
        <div class="register-row">
          <button id="reg-paper" type="button">📕 紙で登録</button>
          <button id="reg-ebook" type="button">📱 電子で登録</button>
        </div>
      </section>
    </section>

    <!-- 蔵書一覧画面（本棚/一覧の2ビュー切替。デザインの正: design/design_spec.json） -->
    <section id="tab-shelf" class="tab" hidden>
      <div class="screen-head">
        <h1>本棚<span class="count" id="shelf-head-count"></span></h1>
        <div id="view-toggle">
          <button type="button" data-view="realistic" class="active">本棚</button>
          <button type="button" data-view="list">一覧</button>
        </div>
      </div>
      <div id="shelf-realistic"></div>
      <div id="shelf-list" hidden>
        <input id="shelf-search" type="search" placeholder="タイトル・著者で検索">
        <p id="shelf-count"></p>
        <ul id="book-list"></ul>
      </div>
    </section>
  </main>

  <!-- 書籍詳細（ボトムシート） -->
  <div id="detail-veil">
    <div id="detail-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-body">
        <div id="detail-cover-slot"></div>
        <div class="sheet-info">
          <h2 id="detail-title"></h2>
          <p id="detail-author"></p>
          <dl class="detail-rows">
            <dt>出版社</dt><dd id="detail-publisher"></dd>
            <dt>形式</dt><dd id="detail-format"></dd>
            <dt>ISBN</dt><dd id="detail-isbn"></dd>
            <dt>登録日</dt><dd id="detail-added"></dd>
          </dl>
        </div>
      </div>
      <div class="sheet-actions">
        <button id="detail-delete" class="delete-btn" type="button">この本を削除</button>
      </div>
    </div>
  </div>

  <nav id="tabbar">
    <button data-tab="shelf" type="button">📚 本棚</button>
    <button data-tab="scan" class="active" type="button">📷 スキャン</button>
  </nav>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"
          integrity="sha384-BzBxP10ZE72aitqj5UMmUsbKFliP/DZqA8Wq+BNNhlIJDGoEd1tpkMYXOg9+n6sB"
          crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
