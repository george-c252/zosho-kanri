<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>蔵書管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <!-- ?v= はキャッシュ更新用。デプロイ時に日付を上げる（M3のsw.jsで正式なバージョン管理に移行） -->
  <link rel="stylesheet" href="css/style.css?v=20260722-8">
</head>
<body>
  <main>
    <!-- スキャン画面（カメラはこのタブを開いた時だけ起動する） -->
    <section id="tab-scan" class="tab" hidden>
      <div class="screen-head">
        <h1>スキャン</h1>
      </div>
      <p id="status"></p>
      <!-- 朱色コーナー＋走査線はプロトタイプ本棚.dc.htmlのスキャン枠を移植 -->
      <div id="viewfinder-wrap">
        <video id="viewfinder" autoplay muted playsinline></video>
        <span class="scan-corner tl"></span>
        <span class="scan-corner tr"></span>
        <span class="scan-corner bl"></span>
        <span class="scan-corner br"></span>
        <div id="scan-line"></div>
      </div>
      <form id="manual-form">
        <input id="manual-isbn" inputmode="numeric" maxlength="13" placeholder="ISBN手入力（978から13桁）">
        <button type="submit">検索</button>
      </form>
      <section id="result" hidden>
        <div id="dup-banner" hidden></div>
        <div class="book-row">
          <img id="cover" alt="表紙" hidden>
          <div class="book-info">
            <p id="book-title"></p>
            <p id="book-author"></p>
            <p id="book-publisher"></p>
            <p id="book-isbn"></p>
          </div>
        </div>
        <!-- 書誌API全滅時の手入力（仕様§5.2: 登録は必ず完了できる） -->
        <div id="manual-book" hidden>
          <input id="manual-title" placeholder="タイトル（必須）">
          <input id="manual-author" placeholder="著者">
        </div>
        <div class="register-row">
          <button id="reg-paper" type="button">📕 紙で登録</button>
          <button id="reg-ebook" type="button">📱 電子で登録</button>
        </div>
      </section>
    </section>

    <!-- 蔵書一覧画面（本棚/一覧の2ビュー切替。デザインの正: design/design_spec.json） -->
    <section id="tab-shelf" class="tab">
      <div class="screen-head">
        <h1>本棚<span class="count" id="shelf-head-count"></span></h1>
        <div id="view-toggle">
          <button type="button" data-view="realistic" class="active">本棚</button>
          <button type="button" data-view="list">一覧</button>
        </div>
      </div>
      <div id="shelf-realistic"></div>
      <div id="shelf-list" hidden>
        <input id="shelf-search" type="search" placeholder="タイトル・著者で検索">
        <p id="shelf-count"></p>
        <ul id="book-list"></ul>
      </div>
    </section>
  </main>

  <!-- 書籍詳細（ボトムシート） -->
  <div id="detail-veil">
    <div id="detail-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-body">
        <div id="detail-cover-slot"></div>
        <div class="sheet-info">
          <p id="detail-status" class="status-pill"></p>
          <h2 id="detail-title"></h2>
          <p id="detail-author"></p>
          <dl class="detail-rows">
            <dt>出版社</dt><dd id="detail-publisher"></dd>
            <dt>形式</dt><dd id="detail-format"></dd>
            <dt>ISBN</dt><dd id="detail-isbn"></dd>
            <dt>登録日</dt><dd id="detail-added"></dd>
          </dl>
        </div>
      </div>
      <!-- 読書アクション。しおり飛ばしはボタンなしの隠しコマンド（表紙を長押し→左右に擦る） -->
      <div class="status-actions">
        <button id="act-start" class="status-btn" type="button" hidden>📖 読みはじめる</button>
        <button id="act-finish" class="status-btn" type="button" hidden>読了にする</button>
      </div>
      <!-- 背表紙の実物写真（3段フォールバックの①） -->
      <div class="photo-actions">
        <button id="spine-photo-btn" class="status-btn" type="button">📷 背表紙写真を設定</button>
        <button id="spine-photo-del" class="status-btn" type="button" hidden>写真を削除</button>
        <input id="spine-photo-input" type="file" accept="image/*" hidden>
      </div>
      <div class="sheet-actions">
        <button id="detail-delete" class="delete-btn" type="button">この本を削除</button>
      </div>
    </div>
  </div>

  <!-- 背表紙写真のトリミング（枠に合わせてドラッグ・2本指ピンチで調整） -->
  <div id="crop-veil" hidden>
    <p class="crop-hint">枠に背表紙を合わせてください（ドラッグで移動・2本指で拡大縮小）</p>
    <div id="crop-stage">
      <img id="crop-img" alt="">
      <div id="crop-frame"></div>
    </div>
    <div class="crop-actions">
      <button id="crop-cancel" type="button">キャンセル</button>
      <button id="crop-ok" type="button">この範囲で設定</button>
    </div>
  </div>

  <!-- トースト（hondanaToast 2.4s） -->
  <div id="toast" hidden></div>

  <nav id="tabbar">
    <button data-tab="shelf" class="active" type="button">📚 本棚</button>
    <button data-tab="scan" type="button">📷 スキャン</button>
  </nav>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"
          integrity="sha384-BzBxP10ZE72aitqj5UMmUsbKFliP/DZqA8Wq+BNNhlIJDGoEd1tpkMYXOg9+n6sB"
          crossorigin="anonymous"></script>
  <script type="module" src="js/main.js?v=20260722-8"></script>
</body>
</html>
